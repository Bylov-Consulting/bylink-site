<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216" width="216" height="216" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123C69"/>
      <stop offset="1" stop-color="#0B2545"/>
    </linearGradient>
  </defs>
  <rect width="216" height="216" rx="44" fill="url(#bg)"/>
  <g fill="none" stroke-width="20" stroke-linecap="round">
    <!-- back link (teal) -->
    <rect x="94" y="62" width="70" height="92" rx="35" stroke="#2EC4B6" transform="rotate(-35 129 108)"/>
    <!-- front link (white) -->
    <rect x="52" y="62" width="70" height="92" rx="35" stroke="#FFFFFF" transform="rotate(-35 87 108)"/>
  </g>
  <!-- teal over white at the lower crossing, so the links interlock -->
  <clipPath id="c"><rect x="88" y="114" width="64" height="56"/></clipPath>
  <g clip-path="url(#c)" fill="none" stroke-width="20">
    <rect x="94" y="62" width="70" height="92" rx="35" stroke="#2EC4B6" transform="rotate(-35 129 108)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
